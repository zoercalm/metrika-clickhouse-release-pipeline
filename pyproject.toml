[project]
name = "metrika-clickhouse-release-pipeline"
version = "0.1.0"
description = "Publish analytics data to ClickHouse only as whole, tested releases (synthetic-data demo)."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Serhii Yashchuk" }]
dependencies = ["clickhouse-connect>=0.8", "dbt-core>=1.8", "dbt-clickhouse>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rp = "release_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
